
name: Run Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Compile application
        run: python -m compileall app

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://placeholder:placeholder@localhost:5432/placeholder
        run: pytest -v
